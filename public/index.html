<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple To-do</title><link rel="stylesheet" href="style.css"></head><body>
<main class="container"><section id="auth"><h1>My To-do List</h1><p class="muted">Login or create an account.</p><div class="card"><form id="loginForm"><input id="loginUser" placeholder="Username" required><input id="loginPass" type="password" placeholder="Password" required><button>Login</button></form><hr><form id="registerForm"><input id="regUser" placeholder="New username" required><input id="regPass" type="password" placeholder="New password (6+ chars)" required><button class="secondary">Register</button></form><p id="authMsg" class="message"></p></div></section>
<section id="todo" hidden><div class="top"><div><h1>My Tasks</h1><p id="welcome" class="muted"></p></div><button id="logout" class="secondary">Logout</button></div><div class="card"><form id="taskForm" class="task-form"><input id="taskTitle" placeholder="What needs to be done?" required><button>Add</button></form><ul id="tasks"></ul><p id="taskMsg" class="message"></p></div></section></main><script src="app.js"></script></body></html>
